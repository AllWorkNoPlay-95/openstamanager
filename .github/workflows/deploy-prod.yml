name: Deploy

on:
  push:
    branches:
      - kartiell-prod

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      APP_DIR: "/root/app"
      DEST_DROPLET: ${{ vars.DIGITALOCEAN_DEST_DROPLET }}
      SSH_USER: ${{ secrets.DIGITALOCEAN_SSH_USERNAME }}
      SSH_KEY: ${{ secrets.DIGITALOCEAN_SSH_RSA }}
      SSH_HOST: ${{ secrets.DIGITALOCEAN_SSH_HOST }}
    steps:
      - name: Check Vars
        run: |
          has_errors=0
          check_var() {
            var_name="$1"
            eval var_value=\$$var_name

            if [ -n "$var_value" ]; then
              echo "[OK] $var_name: $var_value"
            else
              has_errors=1
              echo "[ERROR] $var_name: NOT AVAILABLE"
            fi
          }
          check_var "APP_DIR"
          check_var "DEST_DROPLET"
          check_var "SSH_USER"
          check_var "SSH_KEY"
          check_var "SSH_HOST"

          if [ "$has_errors" -eq 0 ];then
            echo "Repo Secrets / Variables are correctly set up!"
            exit 0
          else
            echo "Check Repo Secrets / Variables!"
            exit 1
          fi

      - name: Create SSH Config
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${SSH_KEY}" | base64 --decode > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat >>~/.ssh/config <<END
            Host $DEST_DROPLET
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
          END

      - name: Test SSH Connection
        run: |
          ssh -T $DEST_DROPLET -o ConnectTimeout=7 "echo 'Connection OK'"

      - name: Pull kartiell-prod
        run: |
          ssh -T $DEST_DROPLET "bash -s" << EOF
          set -e
          cd $APP_DIR
          if [ -d "openstamanager/.git" ]; then
            echo "OpenStaManager exists, updating to kartiell-prod..."
            git -C openstamanager fetch origin kartiell-prod
            git -C openstamanager checkout -B kartiell-prod FETCH_HEAD
            git -C openstamanager reset --hard FETCH_HEAD
          else
            echo "OpenStaManager missing, cloning kartiell-prod..."
            git clone --branch kartiell-prod --single-branch git@github.com:AllWorkNoPlay-95/openstamanager.git openstamanager
          fi
          EOF

      - name: Rebuild and restart OpenStaManager
        run: |
          ssh -T $DEST_DROPLET "bash -s" << EOF
          set -e
          cd $APP_DIR
          docker compose build openstamanager
          docker compose up -d --no-deps openstamanager
          EOF
